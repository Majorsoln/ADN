{% extends "base.html" %}
{% block title %}Login - ADN Project Manager{% endblock %}

{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);">
    <div style="width:100%;max-width:420px;padding:20px;">
        <div style="text-align:center;margin-bottom:32px;">
            <h2 style="font-weight:800;background:linear-gradient(135deg,#3b82f6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2rem;margin-bottom:4px;">ADN Projects</h2>
            <p style="color:#64748b;font-size:0.85rem;">uPVC & Aluminum Solutions - Project Manager</p>
        </div>
        <div style="background:white;border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <h4 style="font-weight:700;color:#0f172a;margin-bottom:24px;">Sign In</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" style="font-size:0.8rem;font-weight:600;color:#475569;">Username</label>
                    <input type="text" name="username" class="form-control" style="border-radius:10px;padding:10px 16px;" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" style="font-size:0.8rem;font-weight:600;color:#475569;">Password</label>
                    <input type="password" name="password" class="form-control" style="border-radius:10px;padding:10px 16px;" required>
                </div>
                {% if form.errors %}
                <div class="alert alert-danger" style="border-radius:10px;font-size:0.85rem;">
                    Invalid username or password.
                </div>
                {% endif %}
                <button type="submit" class="btn w-100 mt-2" style="background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;border-radius:10px;padding:10px;font-weight:700;">
                    Sign In
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'register' %}" style="color:#3b82f6;font-size:0.85rem;font-weight:500;">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
