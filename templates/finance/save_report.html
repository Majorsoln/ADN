{% extends "base.html" %}
{% block title %}Save Report{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'finance:report' %}" class="btn btn-link text-muted me-2 p-0">
    <i class="bi bi-arrow-left"></i>
  </a>
  <div>
    <h2 class="mb-0">Save Report</h2>
    <small class="text-muted">Archive this report for future reference</small>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
            {% endif %}
          </div>
          {% endfor %}
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-cloud-arrow-down me-1"></i>Save to Archive
            </button>
            <a href="{% url 'finance:report' %}" class="btn btn-link text-muted">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
