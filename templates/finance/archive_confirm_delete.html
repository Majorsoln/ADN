{% extends "base.html" %}
{% block title %}Delete Report{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card border-danger shadow-sm">
      <div class="card-header bg-danger text-white fw-semibold">
        <i class="bi bi-trash me-2"></i>Delete Saved Report
      </div>
      <div class="card-body">
        <p>Delete saved report <strong>{{ snapshot.title }}</strong>?</p>
        <p class="text-muted small">Period: {{ snapshot.period_from }} – {{ snapshot.period_to }}</p>
        <p class="text-danger small">This cannot be undone.</p>
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
          <a href="{% url 'finance:archive' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
