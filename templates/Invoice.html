<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADN uPVC & Aluminum – Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2e5a;
    --blue: #2176ae;
    --sky: #3aacdc;
    --sky-pale: #e6f4fb;
    --white: #ffffff;
    --border: #b8d4e8;
    --mid: #4a6a8a;
    --soft: #f0f6fc;
    --shadow: 0 4px 28px rgba(26,46,90,0.13);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #e8f0f8;
    color: var(--navy);
    min-height: 100vh;
  }

  .app {
    display: grid;
    grid-template-columns: 400px 1fr;
    min-height: 100vh;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--navy);
    padding: 30px 24px 40px;
    overflow-y: auto;
    position: sticky; top: 0; height: 100vh;
  }

  .sidebar-logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid #2a4070;
  }
  .sidebar-logo img {
    width: 46px; height: 46px; object-fit: contain;
    background: white; border-radius: 8px; padding: 4px;
  }
  .sidebar-logo span {
    font-family: 'DM Serif Display', serif;
    color: var(--sky); font-size: 14px; line-height: 1.4;
  }

  .form-section { margin-bottom: 20px; }
  .form-section h3 {
    font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase;
    color: var(--sky); font-weight: 600; margin-bottom: 10px;
    padding-bottom: 5px; border-bottom: 1px solid #2a4070;
  }

  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 10.5px; color: #7aaac8;
    font-weight: 500; margin-bottom: 3px;
  }
  .field input, .field textarea {
    width: 100%; background: #0f1f42;
    border: 1px solid #2a4070; border-radius: 7px;
    padding: 8px 11px; color: white;
    font-family: 'DM Sans', sans-serif; font-size: 12.5px;
    transition: border-color .2s; outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--sky); }
  .field textarea { resize: vertical; min-height: 55px; }
  .field input::placeholder, .field textarea::placeholder { color: #2a4070; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .btn-generate {
    width: 100%; padding: 13px;
    background: var(--sky);
    border: none; border-radius: 9px;
    color: var(--navy); font-family: 'DM Sans', sans-serif;
    font-size: 13.5px; font-weight: 700; cursor: pointer;
    transition: background .2s, transform .1s;
    margin-top: 4px;
  }
  .btn-generate:hover { background: #5bbde0; }
  .btn-generate:active { transform: scale(.98); }

  .btn-download {
    width: 100%; padding: 11px;
    background: transparent;
    border: 1px solid #2a4070; border-radius: 9px;
    color: var(--sky); font-family: 'DM Sans', sans-serif;
    font-size: 12.5px; font-weight: 500; cursor: pointer;
    transition: border-color .2s, background .2s;
    margin-top: 8px;
  }
  .btn-download:hover { background: #0f1f42; border-color: var(--sky); }

  /* ── PREVIEW ── */
  .preview-area {
    padding: 36px;
    display: flex; flex-direction: column; align-items: center;
  }
  .preview-label {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--mid); font-weight: 600; margin-bottom: 18px;
    align-self: flex-start;
  }

  /* ── INVOICE ── */
  .invoice-wrap {
    background: var(--white);
    border-radius: 10px;
    box-shadow: var(--shadow);
    width: 100%; max-width: 750px;
    overflow: hidden;
  }

  /* Header */
  .inv-header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--navy);
    padding: 20px 28px;
    gap: 20px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .inv-header-brand { display: flex; align-items: center; gap: 14px; }
  .inv-header-brand img {
    width: 52px; height: 52px; object-fit: contain;
    background: white; border-radius: 8px; padding: 4px;
  }
  .inv-header-brand .company {
    font-family: 'DM Serif Display', serif;
    color: var(--sky); font-size: 16px; line-height: 1.2;
  }
  .inv-header-brand .tagline {
    font-size: 10.5px; color: #7aaac8; margin-top: 3px;
  }
  .inv-header-right .inv-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px; color: white; letter-spacing: -0.5px; text-align: right;
  }
  .inv-header-right .inv-title span { color: var(--sky); }

  /* Info block */
  .inv-info {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    border-bottom: 2px solid var(--navy);
  }
  .inv-info-block {
    padding: 16px 20px;
    border-right: 1px solid var(--border);
  }
  .inv-info-block:last-child { border-right: none; }
  .inv-info-block .block-label {
    font-size: 8.5px; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--blue); font-weight: 700; margin-bottom: 7px;
    padding-bottom: 4px; border-bottom: 2px solid var(--sky);
    display: inline-block;
  }
  .inv-info-block .block-value {
    font-size: 12px; color: var(--navy); font-weight: 500; line-height: 1.65;
  }
  .inv-info-block .block-value small { font-size: 10.5px; color: var(--mid); font-weight: 400; }

  /* Desc banner */
  .inv-desc {
    padding: 12px 22px;
    background: var(--sky-pale);
    font-size: 11.5px; color: var(--navy); line-height: 1.6;
    border-bottom: 1px solid var(--border);
    border-left: 4px solid var(--sky);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .inv-desc strong { color: var(--navy); }

  /* Table */
  .inv-table { width: 100%; border-collapse: collapse; }
  .inv-table thead tr {
    background: var(--navy);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .inv-table thead th {
    padding: 10px 16px; text-align: left;
    font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase;
    font-weight: 600; color: white;
  }
  .inv-table thead th:nth-child(3),
  .inv-table thead th:nth-child(4),
  .inv-table thead th:last-child { text-align: right; }
  .inv-table tbody tr { border-bottom: 1px solid var(--border); }
  .inv-table tbody tr:nth-child(even) {
    background: var(--sky-pale);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .inv-table tbody td {
    padding: 13px 16px; font-size: 12.5px; color: var(--navy); vertical-align: top;
  }
  .inv-table tbody td:nth-child(1) { color: var(--mid); font-size: 11.5px; width: 36px; }
  .inv-table tbody td:nth-child(3),
  .inv-table tbody td:nth-child(4),
  .inv-table tbody td:last-child { text-align: right; }
  .inv-table tbody td.amount { font-weight: 700; color: var(--navy); }

  /* Summary */
  .inv-summary {
    display: flex; justify-content: flex-end;
    padding: 12px 22px 18px;
    border-bottom: 1px solid var(--border);
  }
  .inv-summary-box { min-width: 270px; }
  .inv-summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 10px; border-bottom: 1px solid var(--border);
    font-size: 12.5px; color: var(--mid);
  }
  .inv-summary-row:last-child {
    border-bottom: none; padding-top: 10px; margin-top: 2px;
    font-size: 14px; font-weight: 700; color: white;
    background: var(--navy); border-radius: 7px; padding: 10px 12px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .inv-summary-row.advance { color: #c0392b; }
  .inv-summary-row span:last-child { font-weight: 600; }
  .inv-summary-row:last-child span:last-child { color: var(--sky); font-size: 15px; }

  /* Footer bank + remarks */
  .inv-footer {
    display: grid; grid-template-columns: 1fr 1fr;
    border-top: 2px solid var(--navy);
  }
  .inv-footer-block {
    padding: 16px 20px;
    border-right: 1px solid var(--border);
  }
  .inv-footer-block:last-child { border-right: none; }
  .inv-footer-block h4 {
    font-size: 8.5px; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--blue); font-weight: 700; margin-bottom: 9px;
    padding-bottom: 4px; border-bottom: 2px solid var(--sky);
    display: inline-block;
  }
  .inv-footer-block p {
    font-size: 11.5px; color: var(--navy); line-height: 1.7;
  }
  .inv-footer-block .bank-row strong { color: var(--navy); }

  /* Signature */
  .inv-sig {
    padding: 14px 22px 18px;
    border-top: 1px solid var(--border);
    display: flex; align-items: flex-end; gap: 0;
  }
  .inv-sig-block { }
  .inv-sig-block img {
    height: 56px; max-width: 170px;
    object-fit: contain; display: block; margin-bottom: 4px;
  }
  .inv-sig-block .sig-line {
    width: 170px; border-bottom: 1.5px solid var(--navy); margin-bottom: 5px;
  }
  .inv-sig-block p { font-size: 10px; color: var(--mid); }
  .inv-sig-block strong { font-size: 12px; color: var(--navy); display: block; margin-top: 2px; }

  /* Bottom bar */
  .inv-bottom {
    background: var(--navy);
    padding: 13px 22px;
    display: flex; justify-content: space-between; align-items: center;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .inv-bottom .prepared {
    font-size: 11.5px; color: #7aaac8;
  }
  .inv-bottom .prepared strong {
    color: var(--sky); display: block; font-size: 12.5px;
  }
  .inv-bottom .thank { font-size: 11px; color: #4a6a8a; font-style: italic; }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 80px 40px; color: var(--mid);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ── PRINT ── */
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    body { background: white; }
    .app { display: block; }
    .sidebar { display: none; }
    .preview-area { padding: 0; }
    .preview-label { display: none; }
    .invoice-wrap { box-shadow: none; border-radius: 0; max-width: 100%; }
  }
</style>
</head>

function fmt(n) {
  return Number(n || 0).toLocaleString('en-TZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function val(id) { return document.getElementById(id).value.trim(); }

  const balance  = subtotal - advance;
