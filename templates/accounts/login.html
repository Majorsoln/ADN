<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingia — ADN uPVC & Aluminum Solutions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #1a2e5a; --sky: #3aacdc; --blue: #2563eb; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--navy) 0%, #0f1e3d 60%, #1a3a6b 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,.35);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .login-header {
      background: var(--navy);
      padding: 2rem 2rem 1.5rem;
      text-align: center;
    }
    .login-header h1 {
      font-family: 'DM Serif Display', serif;
      color: #fff;
      font-size: 1.4rem;
      margin: 0;
    }
    .login-header h1 span { color: var(--sky); }
    .login-header p { color: rgba(255,255,255,.55); font-size: .8rem; margin: .4rem 0 0; }
    .login-body { padding: 2rem; }
    .form-label { font-weight: 600; font-size: .85rem; color: #374151; }
    .form-control {
      border-radius: 8px; border: 1.5px solid #e2e8f0;
      padding: .65rem .9rem; font-size: .9rem;
    }
    .form-control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .btn-login {
      background: var(--navy); color: #fff; border: none;
      border-radius: 8px; padding: .75rem; font-weight: 600;
      width: 100%; font-size: .95rem; letter-spacing: .02em;
      transition: background .2s;
    }
    .btn-login:hover { background: #243d72; color: #fff; }
    .input-icon { position: relative; }
    .input-icon i {
      position: absolute; left: .85rem; top: 50%; transform: translateY(-50%);
      color: #94a3b8; font-size: 1rem; z-index: 2;
    }
    .input-icon .form-control { padding-left: 2.5rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <h1>ADN <span>uPVC & Aluminum</span></h1>
    <p>Business Management System</p>
  </div>
  <div class="login-body">

    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-danger py-2 px-3 mb-3 small">
          <i class="bi bi-exclamation-circle me-1"></i>{{ msg }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Jina la Mtumiaji</label>
        <div class="input-icon">
          <i class="bi bi-person"></i>
          <input type="text" name="username" class="form-control
            {% if form.username.errors %}is-invalid{% endif %}"
            placeholder="username" autofocus autocomplete="username"
            value="{{ form.username.value|default:'' }}">
        </div>
        {% if form.username.errors %}
          <div class="invalid-feedback d-block small">{{ form.username.errors.0 }}</div>
        {% endif %}
      </div>

      <div class="mb-4">
        <label class="form-label">Nywila</label>
        <div class="input-icon">
          <i class="bi bi-lock"></i>
          <input type="password" name="password" class="form-control
            {% if form.password.errors %}is-invalid{% endif %}"
            placeholder="••••••••" autocomplete="current-password">
        </div>
        {% if form.password.errors %}
          <div class="invalid-feedback d-block small">{{ form.password.errors.0 }}</div>
        {% endif %}
      </div>

      <button type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Ingia
      </button>
    </form>

  </div>
</div>
</body>
</html>
